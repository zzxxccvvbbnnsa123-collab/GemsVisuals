name: Build GemsVisuals APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --stacktrace --info assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: GemsVisuals-APK
          path: app/build/outputs/apk/debug/*.apk
